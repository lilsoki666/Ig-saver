name: Build IGSaver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ==========================================================
      # 4. SYSTEM DEPENDENCIES
      # ==========================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache

      # ==========================================================
      # 5. INSTALL PYTHON BUILD TOOLS
      # ==========================================================
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==0.29.37" \
            "buildozer==1.5.0"

          echo ""
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          which python
          python --version

          echo ""
          echo "=========================================="
          echo "CYTHON"
          echo "=========================================="

          which cython
          cython --version

          echo ""
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          which buildozer
          buildozer --version

      # ==========================================================
      # 6. FIX PYTHON-FOR-ANDROID DEPENDENCIES
      # ==========================================================
      - name: Fix python-for-android dependencies
        run: |
          python -m pip install --force-reinstall \
            "sh>=1.10,<2.0"

          python -m pip install \
            "appdirs" \
            "colorama>=0.3.3" \
            "jinja2" \
            "meson" \
            "ninja" \
            "build" \
            "toml" \
            "packaging" \
            "setuptools" \
            "wheel~=0.43.0"

          echo ""
          echo "=========================================="
          echo "SH VERSION"
          echo "=========================================="

          python -m pip show sh

      # ==========================================================
      # 7. PREPARE BUILDOZER SDK DIRECTORY
      # ==========================================================
      - name: Prepare Buildozer SDK directory
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"
          mkdir -p "$SDK/cmdline-tools"

          echo ""
          echo "=========================================="
          echo "BUILDOZER SDK"
          echo "=========================================="

          echo "$SDK"

          ls -la "$HOME/.buildozer/android/platform"

      # ==========================================================
      # 8. INSTALL ANDROID COMMAND LINE TOOLS
      # ==========================================================
      - name: Install Android command line tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          cd /tmp

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -r cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          # ======================================================
          # Buildozer/python-for-android compatibility
          #
          # Modern SDK:
          # cmdline-tools/latest/bin/sdkmanager
          #
          # Legacy path expected by some Buildozer versions:
          # tools/bin/sdkmanager
          # ======================================================

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools"

          ln -s \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/bin"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "=========================================="
          echo "ANDROID COMMAND LINE TOOLS"
          echo "=========================================="

          echo ""
          echo "Modern sdkmanager:"
          ls -lh \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo ""
          echo "Legacy sdkmanager:"
          ls -lh \
            "$SDK/tools/bin/sdkmanager"

      # ==========================================================
      # 9. VERIFY SDKMANAGER
      # ==========================================================
      - name: Verify sdkmanager
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "SDKMANAGER VERIFICATION"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Modern sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "Buildozer sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "PATH sdkmanager:"
          which sdkmanager

          echo ""
          echo "SDKMANAGER OK."

      # ==========================================================
      # 10. ACCEPT ANDROID LICENSES
      # ==========================================================
      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ==========================================================
      # 11. INSTALL ANDROID SDK PACKAGES
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "=========================================="
          echo "INSTALLED ANDROID PACKAGES"
          echo "=========================================="

          "$SDK/tools/bin/sdkmanager" --list_installed

      # ==========================================================
      # 12. VERIFY AIDL
      # ==========================================================
      - name: Verify AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "AIDL VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Searching AIDL:"

          find "$SDK" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "Expected AIDL:"

          test -f \
            "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL file:"

          ls -lh \
            "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL test:"

          "$SDK/build-tools/35.0.0/aidl" --help >/dev/null

          echo ""
          echo "AIDL OK."

      # ==========================================================
      # 13. VERIFY COMPLETE SDK
      # ==========================================================
      - name: Verify Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "ANDROID SDK STRUCTURE"
          echo "=========================================="

          echo ""
          echo "SDK root:"
          ls -la "$SDK"

          echo ""
          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "Platforms:"
          ls -la "$SDK/platforms"

          echo ""
          echo "Platform Tools:"
          ls -la "$SDK/platform-tools"

          echo ""
          echo "Legacy tools:"
          ls -la "$SDK/tools"

      # ==========================================================
      # 14. VERIFY PROJECT
      # ==========================================================
      - name: Verify Android project
        working-directory: android
        run: |
          echo ""
          echo "=========================================="
          echo "IGSAVER PROJECT"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo ""
          echo "Android project OK."

      # ==========================================================
      # 15. INSTALL PYTHON-FOR-ANDROID
      # ==========================================================
      - name: Install python-for-android
        run: |
          python -m pip install \
            "python-for-android==2024.1.21"

          echo ""
          echo "=========================================="
          echo "PYTHON-FOR-ANDROID"
          echo "=========================================="

          which p4a
          p4a --version

      # ==========================================================
      # 16. CLEAN BUILDOZER PROJECT CACHE
      # ==========================================================
      - name: Clean Buildozer project cache
        working-directory: android
        run: |
          rm -rf .buildozer

          echo "Buildozer project cache cleaned."

      # ==========================================================
      # 17. FINAL AIDL CHECK
      # ==========================================================
      - name: Final AIDL check
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "FINAL AIDL CHECK"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "AIDL locations:"

          find "$SDK" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "Expected AIDL:"

          test -f \
            "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL path:"

          readlink -f \
            "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL test:"

          "$SDK/build-tools/35.0.0/aidl" --help >/dev/null

          echo ""
          echo "FINAL AIDL CHECK PASSED."

      # ==========================================================
      # 18. FINAL BUILD ENVIRONMENT
      # ==========================================================
      - name: Configure build environment
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$HOME/.local/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo ""
          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Python:"
          which python
          python --version

          echo ""
          echo "Cython:"
          which cython
          cython --version

          echo ""
          echo "Buildozer:"
          which buildozer
          buildozer --version

          echo ""
          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          echo ""
          echo "AIDL:"
          readlink -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

      # ==========================================================
      # 19. BUILD APK
      # ==========================================================
      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          export PATH="$HOME/.local/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo ""
          echo "=========================================="
          echo "        BUILDING IGSAVER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Checking sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo ""
          echo "Checking AIDL:"
          test -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help >/dev/null

          echo ""
          echo "Starting Buildozer..."
          echo ""

          buildozer android debug

      # ==========================================================
      # 20. FIND APK
      # ==========================================================
      - name: Find APK
        working-directory: android
        run: |
          echo ""
          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          echo "$APK"

      # ==========================================================
      # 21. UPLOAD APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 7
