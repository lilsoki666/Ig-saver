name: Build IGSaver APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev libsqlite3-dev \
            autoconf automake libtool pkg-config \
            zlib1g-dev libltdl-dev libncurses5-dev \
            cmake gettext

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.37" "buildozer==1.5.0"

      - name: Verify configuration
        run: |
          python --version
          java -version
          buildozer --version
          grep -E '^(title|package.name|version|requirements|android.api|android.minapi|android.ndk|android.archs|orientation)' buildozer.spec

      - name: Build debug APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-debug-apk
          path: bin/*.apk
          if-no-files-found: error
