name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "=== PROJECT ==="
          find . -maxdepth 3 -type f | sort
          echo "=== ANDROID ==="
          ls -la android
          echo "=== BUILDZ​​ER SPEC ==="
          test -f android/buildozer.spec

      - name: Build APK
        run: |
          docker pull kivy/buildozer:latest

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/android:/home/user/hostcwd" \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-APK
          path: android/bin/*.apk
          if-no-files-found: error
