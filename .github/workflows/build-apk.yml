name: Build IGSaver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      # ==========================================================
      # IMPORTANT:
      # Use the same SDK location that Buildozer/python-for-android
      # will use.
      # ==========================================================
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ==========================================================
      # 4. SYSTEM DEPENDENCIES
      # ==========================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache

      # ==========================================================
      # 5. PYTHON BUILD TOOLS
      # ==========================================================
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==0.29.37" \
            "buildozer==1.5.0"

          echo ""
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          which python
          python --version

          echo ""
          echo "=========================================="
          echo "CYTHON"
          echo "=========================================="

          python -m pip show Cython
          cython --version

          echo ""
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          which buildozer
          buildozer --version

      # ==========================================================
      # 6. PREPARE BUILDOZER SDK DIRECTORY
      # ==========================================================
      - name: Prepare Buildozer SDK directory
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"
          mkdir -p "$SDK/cmdline-tools"

          echo "Buildozer SDK:"
          echo "$SDK"

          echo ""
          echo "Directory:"
          ls -la "$HOME/.buildozer/android/platform"

      # ==========================================================
      # 7. INSTALL ANDROID COMMAND LINE TOOLS
      # ==========================================================
      - name: Install Android command line tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          cd /tmp

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -r cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "=========================================="
          echo "ANDROID COMMAND LINE TOOLS"
          echo "=========================================="

          ls -la "$SDK/cmdline-tools/latest"

      # ==========================================================
      # 8. VERIFY SDKMANAGER
      # ==========================================================
      - name: Verify sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          which sdkmanager

          sdkmanager --version

      # ==========================================================
      # 9. ACCEPT ANDROID LICENSES
      # ==========================================================
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ==========================================================
      # 10. INSTALL EXACT ANDROID SDK PACKAGES
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "=========================================="
          echo "INSTALLED ANDROID PACKAGES"
          echo "=========================================="

          sdkmanager --list_installed

      # ==========================================================
      # 11. VERIFY AIDL
      # ==========================================================
      - name: Verify AIDL
        run: |
          SDK="$ANDROID_HOME"

          echo ""
          echo "=========================================="
          echo "VERIFY AIDL"
          echo "=========================================="

          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "Build Tools:"
          ls -la "$SDK/build-tools/35.0.0"

          echo ""
          echo "AIDL file:"

          test -f \
            "$SDK/build-tools/35.0.0/aidl"

          ls -lh \
            "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL help test:"

          "$SDK/build-tools/35.0.0/aidl" --help >/dev/null

          echo ""
          echo "AIDL OK."

      # ==========================================================
      # 12. VERIFY COMPLETE SDK STRUCTURE
      # ==========================================================
      - name: Verify complete Android SDK
        run: |
          echo ""
          echo "=========================================="
          echo "ANDROID SDK STRUCTURE"
          echo "=========================================="

          echo ""
          echo "SDK root:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Platform:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Platform Tools:"
          ls -la "$ANDROID_HOME/platform-tools"

          echo ""
          echo "AIDL:"
          find "$ANDROID_HOME" \
            -type f \
            -name aidl \
            -print

      # ==========================================================
      # 13. VERIFY PROJECT STRUCTURE
      # ==========================================================
      - name: Verify Android project
        working-directory: android
        run: |
          echo ""
          echo "=========================================="
          echo "IGSAVER PROJECT"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo ""
          echo "Project structure OK."

      # ==========================================================
      # 14. INSTALL PYTHON-FOR-ANDROID
      # ==========================================================
      - name: Install python-for-android
        run: |
          python -m pip install \
            "python-for-android==2024.1.21"

          echo ""
          echo "=========================================="
          echo "PYTHON-FOR-ANDROID"
          echo "=========================================="

          which p4a
          p4a --version

      # ==========================================================
      # 15. CLEAN OLD BUILDOZER CACHE
      # ==========================================================
      - name: Clean Buildozer cache
        working-directory: android
        run: |
          rm -rf .buildozer

          echo "Buildozer project cache cleaned."

      # ==========================================================
      # 16. VERIFY AIDL AT BUILDOZER LOCATION
      # ==========================================================
      - name: Verify AIDL at Buildozer location
        run: |
          echo ""
          echo "=========================================="
          echo "FINAL AIDL CHECK"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Searching for AIDL:"

          find "$ANDROID_HOME" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "Expected AIDL:"

          test -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL path:"

          readlink -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "Testing AIDL:"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help >/dev/null

          echo ""
          echo "FINAL AIDL CHECK PASSED."

      # ==========================================================
      # 17. CONFIGURE BUILD ENVIRONMENT
      # ==========================================================
      - name: Configure Build environment
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo ""
          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Python:"
          which python
          python --version

          echo ""
          echo "Cython:"
          which cython
          cython --version

          echo ""
          echo "Buildozer:"
          which buildozer
          buildozer --version

          echo ""
          echo "AIDL:"
          readlink -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

      # ==========================================================
      # 18. BUILD APK
      # ==========================================================
      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          export PATH="$HOME/.local/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo ""
          echo "=========================================="
          echo "          BUILDING IGSAVER APK"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "AIDL:"
          test -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "Starting Buildozer..."

          buildozer android debug

      # ==========================================================
      # 19. FIND APK
      # ==========================================================
      - name: Find APK
        working-directory: android
        run: |
          echo ""
          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          echo "$APK"

      # ==========================================================
      # 20. UPLOAD APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 7
