name: Build IGSaver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      P4A_COMMIT: 957a3e5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl build-essential autoconf automake libtool \
            pkg-config libltdl-dev libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake ninja-build ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.37" "buildozer==1.5.0"

          python --version
          cython --version
          buildozer --version

      - name: Prepare Buildozer SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

      - name: Install Android command line tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          cd /tmp
          rm -rf cmdline-tools commandlinetools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip
          rm -rf "$SDK/cmdline-tools"
          mkdir -p "$SDK/cmdline-tools"
          mv cmdline-tools "$SDK/cmdline-tools/latest"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Create Buildozer sdkmanager wrapper
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK/tools"
          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<'EOF'
          #!/bin/bash
          SDK="/home/runner/.buildozer/android/platform/android-sdk"
          exec "$SDK/cmdline-tools/latest/bin/sdkmanager" "$@"
          EOF

          chmod +x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          yes | "$SDK/tools/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          "$SDK/tools/bin/sdkmanager" --list_installed

      - name: Verify AIDL and SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          test -x "$SDK/tools/bin/sdkmanager"
          "$SDK/tools/bin/sdkmanager" --version

          test -f "$SDK/build-tools/35.0.0/aidl"
          "$SDK/build-tools/35.0.0/aidl" --help >/dev/null

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          echo "Android SDK/AIDL OK."

      - name: Verify Android project
        working-directory: android
        run: |
          test -f buildozer.spec
          test -f main.py
          echo "Android project OK."

      - name: Pre-seed pinned python-for-android
        working-directory: android
        run: |
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"

          rm -rf "$P4A_DIR"
          git clone --depth 1 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          cd "$P4A_DIR"
          git fetch --depth 1 origin "$P4A_COMMIT"
          git checkout "$P4A_COMMIT"

          echo "Pinned p4a commit:"
          git rev-parse HEAD
          git log -1 --oneline

          test "$(git rev-parse HEAD)" = "$P4A_COMMIT"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          export PATH="$HOME/.local/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "Python:"
          python --version

          echo "Cython:"
          cython --version

          echo "Buildozer:"
          buildozer --version

          echo "sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo "AIDL:"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help >/dev/null

          echo "Building with pinned p4a commit: $P4A_COMMIT"

          buildozer android debug

      - name: Find APK
        working-directory: android
        run: |
          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 7
