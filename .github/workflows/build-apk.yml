name: Build IGSaver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: igsaver-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "=== PROJECT ==="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            ! -path './.buildozer/*' \
            | sort

      - name: Build APK in official Buildozer container
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/home/user/hostcwd" \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print
          test -n "$(find . -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 14
