name: Build IGSaver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # PYTHON 3.11
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache


      # ============================================================
      # PYTHON BUILD TOOLS
      # ============================================================

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "Cython==0.29.37" \
            "buildozer==1.5.0"

          echo ""
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          which python
          python --version

          echo ""
          echo "=========================================="
          echo "CYTHON"
          echo "=========================================="

          which cython
          cython --version

          echo ""
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          which buildozer
          buildozer --version


      # ============================================================
      # PYTHON-FOR-ANDROID DEPENDENCIES
      # ============================================================

      - name: Fix python-for-android dependencies
        run: |
          python -m pip install --force-reinstall \
            "sh>=1.10,<2.0"

          python -m pip install \
            "appdirs" \
            "colorama>=0.3.3" \
            "jinja2" \
            "meson" \
            "ninja" \
            "build" \
            "toml" \
            "packaging" \
            "setuptools" \
            "wheel~=0.43.0"

          echo ""
          echo "=========================================="
          echo "SH VERSION"
          echo "=========================================="

          python -m pip show sh


      # ============================================================
      # PREPARE BUILDOZER SDK DIRECTORY
      # ============================================================

      - name: Prepare Buildozer SDK directory
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          echo ""
          echo "=========================================="
          echo "BUILDOZER SDK"
          echo "=========================================="

          echo "SDK:"
          echo "$SDK"

          mkdir -p "$SDK/cmdline-tools"


      # ============================================================
      # INSTALL MODERN ANDROID COMMAND LINE TOOLS
      # ============================================================

      - name: Install Android command line tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          cd /tmp

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          echo ""
          echo "Downloading Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          echo ""
          echo "Extracting command line tools..."

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools"

          mv \
            cmdline-tools \
            "$SDK/cmdline-tools/latest"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "=========================================="
          echo "ANDROID COMMAND LINE TOOLS"
          echo "=========================================="

          ls -lh \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo ""
          echo "sdkmanager version:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version


      # ============================================================
      # VERIFY MODERN SDKMANAGER
      # ============================================================

      - name: Verify Android sdkmanager
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "SDKMANAGER VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager path:"

          which sdkmanager

          echo ""
          echo "sdkmanager version:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "SDKMANAGER OK."


      # ============================================================
      # ACCEPT LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "ANDROID SDK LICENSES"
          echo "=========================================="

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --licenses \
            >/dev/null 2>&1 || true

          echo ""
          echo "Android SDK licenses processed."


      # ============================================================
      # INSTALL SDK PACKAGES
      # ============================================================

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "INSTALL ANDROID SDK PACKAGES"
          echo "=========================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "=========================================="
          echo "INSTALLED PACKAGES"
          echo "=========================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --list_installed


      # ============================================================
      # VERIFY AIDL
      # ============================================================

      - name: Verify AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "AIDL VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Searching AIDL..."

          find "$SDK" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "Checking expected AIDL..."

          test -f \
            "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL file:"

          ls -lh \
            "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL test:"

          "$SDK/build-tools/35.0.0/aidl" \
            --help \
            >/dev/null

          echo ""
          echo "AIDL OK."


      # ============================================================
      # VERIFY SDK STRUCTURE
      # ============================================================

      - name: Verify Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "ANDROID SDK STRUCTURE"
          echo "=========================================="

          echo ""
          echo "SDK ROOT:"
          ls -la "$SDK"

          echo ""
          echo "CMDLINE TOOLS:"
          ls -la "$SDK/cmdline-tools"

          echo ""
          echo "LATEST:"
          ls -la "$SDK/cmdline-tools/latest"

          echo ""
          echo "BUILD TOOLS:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "PLATFORMS:"
          ls -la "$SDK/platforms"

          echo ""
          echo "PLATFORM TOOLS:"
          ls -la "$SDK/platform-tools"


      # ============================================================
      # VERIFY IGSAVER PROJECT
      # ============================================================

      - name: Verify Android project
        working-directory: android
        run: |
          echo ""
          echo "=========================================="
          echo "IGSAVER PROJECT"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo ""
          echo "Android project OK."


      # ============================================================
      # INSTALL PYTHON-FOR-ANDROID
      # ============================================================

      - name: Install python-for-android
        run: |
          python -m pip install \
            "python-for-android==2024.1.21"

          echo ""
          echo "=========================================="
          echo "PYTHON-FOR-ANDROID"
          echo "=========================================="

          which p4a

          p4a --version


      # ============================================================
      # CLEAN PROJECT CACHE
      # ============================================================

      - name: Clean Buildozer project cache
        working-directory: android
        run: |
          echo ""
          echo "=========================================="
          echo "CLEAN BUILDOZER CACHE"
          echo "=========================================="

          rm -rf .buildozer

          echo ""
          echo "Buildozer project cache cleaned."


      # ============================================================
      # FINAL SDK CHECK
      # ============================================================

      - name: Final Android SDK check
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "=========================================="
          echo "FINAL ANDROID SDK CHECK"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --version

          echo ""
          echo "AIDL:"

          test -f \
            "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" \
            --help \
            >/dev/null

          echo ""
          echo "Android SDK check PASSED."


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

        run: |
          export PATH="$HOME/.local/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo ""
          echo "=========================================="
          echo "        BUILDING IGSAVER APK"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "sdkmanager:"
          sdkmanager --version

          echo ""
          echo "AIDL:"
          test -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --help \
            >/dev/null

          echo ""
          echo "Starting Buildozer..."
          echo ""

          buildozer android debug


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find APK
        working-directory: android
        run: |
          echo ""
          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          echo "$APK"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 7
