name: Build IGSaver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Python 3.11
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 4. System dependencies
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache

      # ============================================================
      # 5. Verify Java / Python
      # ============================================================
      - name: Verify Java and Python
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          pip --version

      # ============================================================
      # 6. Install Buildozer
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0"

          echo ""
          echo "Buildozer:"
          buildozer --version

      # ============================================================
      # 7. Install Android command line tools
      # ============================================================
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          mv cmdline-tools/* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android command line tools installed."

      # ============================================================
      # 8. Accept SDK licenses
      # ============================================================
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ============================================================
      # 9. Install exact Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android packages:"
          sdkmanager --list_installed

      # ============================================================
      # 10. Verify Android SDK and AIDL
      # ============================================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Android SDK directory:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "Checking AIDL..."

          test -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help >/dev/null

          echo "AIDL OK."

      # ============================================================
      # 11. Verify project structure
      # ============================================================
      - name: Verify Android project
        working-directory: android
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking buildozer.spec..."
          test -f buildozer.spec

          echo ""
          echo "Checking main.py..."
          test -f main.py

          echo ""
          echo "Android project OK."

      # ============================================================
      # 12. Install python-for-android
      # ============================================================
      - name: Install python-for-android
        run: |
          python -m pip install \
            "python-for-android==2024.1.21"

          echo ""
          echo "python-for-android:"
          p4a --version

      # ============================================================
      # 13. Clean Buildozer
      # ============================================================
      - name: Clean Buildozer cache
        working-directory: android
        run: |
          rm -rf .buildozer

          echo "Buildozer cache cleaned."

      # ============================================================
      # 14. Configure Android environment
      # ============================================================
      - name: Configure Android environment
        working-directory: android
        run: |
          export ANDROID_HOME=/home/runner/android-sdk
          export ANDROID_SDK_ROOT=/home/runner/android-sdk

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "AIDL path:"
          readlink -f \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "Environment configured."

      # ============================================================
      # 15. Build APK
      # ============================================================
      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "=========================================="
          echo "        BUILDING IGSAVER APK"
          echo "=========================================="

          buildozer android debug

      # ============================================================
      # 16. Find APK
      # ============================================================
      - name: Find APK
        working-directory: android
        run: |
          echo "Searching generated APK..."

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully:"
          echo "$APK"

      # ============================================================
      # 17. Upload APK artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGSaver-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 7
